<!DOCTYPE html>
<html>
<head>
    <title>Erito Learning Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SQL Learning Lab</h1>

    <p>Learn SQL by actually writing SQL.</p>

    <div class="lesson-card">
        <h2>SELECT</h2>
        <p>Learn how to retrieve data from a table.</p>
        <button id="startButton">Start Learning</button>
    </div>

    <div id="lessonPopup" class="popup">
        <div class="popup-content">

            <h2>SELECT</h2>

            <p>
                SELECT is used to retrieve data
                from a database table.
            </p>

            <h3>Basic Syntax</h3>

            <pre><code>SELECT column_name
FROM table_name;</code></pre>

            <button id="closeButton">Got it</button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
