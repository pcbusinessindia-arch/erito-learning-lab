    <h1>SQL: SELECT</h1>

    <p>
        Learn how to retrieve data from a database table.
    </p>

    <h2>What is SELECT?</h2>

    <p>
        SELECT is used to retrieve data from one or more columns
        of a database table.
    </p>

    <h2>Basic Syntax</h2>

    <pre><code>SELECT column_name
FROM table_name;</code></pre>

    <h2>Example</h2>

    <pre><code>SELECT name
FROM customers;</code></pre>
